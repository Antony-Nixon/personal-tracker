<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="description" content="A simple personal task tracker">
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./icons/icon-192.png"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./dashboard.css">
<title>My Tracker</title>
</head>
<body>
<div class="app">
<header class="top">
  <div><h1>My Tracker</h1><div class="date" id="today"></div></div>
  <button class="btn primary" id="addBtn">+ Task</button>
</header>

<section class="summary">
  <div class="summary-line"><strong id="progressText">0 / 0 completed</strong></div>
  <div class="bar"><div class="fill" id="progress"></div></div>
</section>

<div class="toolbar">
  <button class="btn" id="notifyBtn">Enable notifications</button>
  <span id="syncStatus">Local only</span>
</div>

<section>
  <div class="section-title"><h2 id="viewTitle">Today's tasks</h2><button class="link-btn" id="todayBtn">Today</button></div>
  <div id="tasks"></div>
</section>

<section class="calendar-card">
  <div class="calendar-head"><button class="icon" id="prevMonth" aria-label="Previous month">‹</button><strong id="calendarTitle"></strong><button class="icon" id="nextMonth" aria-label="Next month">›</button></div>
  <div class="calendar-grid" id="calendarGrid"></div>
</section>

<section class="dashboard" aria-labelledby="dashboardTitle">
  <div class="dashboard-heading"><div><h2 id="dashboardTitle">Progress dashboard</h2><p>Consistency across your tasks and habits.</p></div></div>
  <div class="dashboard-summary" id="dashboardSummary"></div>
  <div class="progress-list" id="taskProgress"></div>
</section>
</div>

<dialog id="taskDialog"><form class="modal" id="taskForm" method="dialog">
  <h2 id="modalTitle">Add task</h2><input type="hidden" id="editId">
  <label>Task</label><input id="title" required maxlength="100" placeholder="e.g. Gym">
  <div class="row"><div><label>Date</label><input id="date" type="date" required></div><div><label>Time</label><input id="time" type="time"></div></div>
  <label>Repeat</label><select id="repeat"><option value="none">Does not repeat</option><option value="daily">Every day</option><option value="weekly">Every week</option><option value="monthly">Every month</option></select>
  <div id="weeklyGoalField" class="goal-field" hidden><label for="weeklyTarget">Weekly session target <span class="optional">(optional)</span></label><input id="weeklyTarget" type="number" min="1" max="7" inputmode="numeric" placeholder="For example, 5"><small>For habits like gym, choose how many sessions you aim to complete each week.</small></div>
  <div class="modal-actions"><button type="button" class="btn" id="cancelBtn">Cancel</button><button class="btn primary">Save task</button></div>
</form></dialog>

<dialog id="postponeDialog"><form class="modal" id="postponeForm" method="dialog">
  <h2>Postpone task</h2><input type="hidden" id="postponeId"><input type="hidden" id="postponeOldDate">
  <label>New date</label><input id="postponeDate" type="date" required><label>New time</label><input id="postponeTime" type="time">
  <div class="modal-actions"><button type="button" class="btn" id="postponeCancel">Cancel</button><button class="btn primary">Postpone</button></div>
</form></dialog>

<dialog id="reviewDialog"><div class="modal review-modal">
  <div class="review-head"><div><h2>🌙 Day review</h2><div class="muted" id="reviewDate"></div></div><button class="icon" id="closeReview">×</button></div>
  <p class="review-summary" id="reviewSummary"></p><div id="reviewTasks"></div>
</div></dialog>

<div class="toast" id="toast"></div>
<script src="./config.js"></script><script src="./app.js"></script>
</body>
</html>
